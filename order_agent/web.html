<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>订单助手 · 订单工作台</title><style>
*{box-sizing:border-box}body{margin:0;color:#28332f;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff}button,textarea{font:inherit}button{cursor:pointer}aside{width:220px;background:#f6f8f7;border-right:1px solid #e6ebe8;height:100vh;padding:24px 16px;display:flex;flex-direction:column}.logo{font-size:21px;font-weight:700;padding:0 10px 30px;color:#245e48}.nav{padding:12px;background:#e5eee9;border-radius:7px;color:#276349}.account{margin-top:auto;padding:14px 8px;border-top:1px solid #e2e8e4;color:#7a857e;font-size:12px}.shell{display:flex;height:100vh}main{flex:1;min-width:0;display:flex;flex-direction:column}header{height:74px;flex-shrink:0;border-bottom:1px solid #e8ece9;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.title{font-weight:600}.workspace{display:flex;flex:1;min-height:0}.conversation{flex:1;min-width:0;display:flex;flex-direction:column}.messages{overflow:auto;flex:1;padding:38px max(28px,7%)}.welcome{margin:9vh auto 35px;max-width:520px}.avatar{width:36px;height:36px;border-radius:10px;background:#e7f1eb;color:#28634a;display:grid;place-items:center;font-size:21px}h1{font-size:25px;font-weight:600;letter-spacing:-.7px;margin:20px 0 12px}p{line-height:1.8;color:#869087}.suggestions{display:grid;gap:10px;margin-top:26px}.suggestions button{border:1px solid #e4e9e5;border-radius:9px;padding:15px 18px;background:#fff;text-align:left;color:#516158}.suggestions button:hover{background:#f5f9f6;border-color:#a8c6b4}.suggestions span{float:right;color:#93a59a}.composer{padding:16px 28px 22px;max-width:880px;width:100%;margin:auto}.input{border:1px solid #dce4de;border-radius:12px;padding:14px;box-shadow:0 3px 16px #203c2310}textarea{border:0;resize:none;width:100%;outline:0;height:54px;background:transparent;color:#34483b}.inputbar{display:flex;align-items:center;justify-content:space-between;color:#8b998f;font-size:12px}.send{border:0;border-radius:7px;background:#2a684c;color:#fff;padding:9px 16px}.send:disabled{opacity:.45}.note{font-size:10px;color:#a0aaa3;text-align:center;margin-top:10px}.bubble{max-width:700px;margin:0 0 28px;line-height:1.9;white-space:pre-wrap}.user{background:#f1f5f2;border-radius:12px;padding:14px 18px;margin-left:auto;width:fit-content;max-width:85%}.assistant .who{font-size:12px;font-weight:600;color:#3d7957;margin-bottom:12px}.answer{white-space:pre-wrap}details{white-space:normal;margin-top:16px;border:1px solid #e3eae4;border-radius:8px;padding:10px 14px;color:#738578;font-size:12px}summary{cursor:pointer}pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8f6;padding:10px}.busy{color:#7c9484;font-size:13px}.error{color:#ab534b}@media(max-width:1000px){aside{width:185px}}@media(max-width:750px){aside{width:140px;padding:18px 8px}header{padding:15px}.messages{padding:25px 18px}.composer{padding:12px}.welcome{margin-top:35px}h1{font-size:22px}}
</style>
<div class="shell">
  <aside>
    <div class="logo">◈ 订单助手</div>
    <div class="nav">▣ &nbsp; 订单工作台</div>
    <div class="account">◉ &nbsp; 客服工作空间</div>
  </aside>
  <main>
    <header><div class="title">订单延误调查助手</div></header>
    <div class="workspace">
      <section class="conversation">
        <div class="messages" id="messages" aria-live="polite"></div>
        <form class="composer" id="form">
          <div class="input">
            <textarea id="prompt" aria-label="输入订单问题" placeholder="例如：A1024 为什么还没到？" maxlength="1800" required></textarea>
            <div class="inputbar"><span>请在问题中写明订单号</span><button class="send" id="send">发送 ↑</button></div>
          </div>
          <div class="note">建议供人工审核 · 当前业务数据为模拟数据</div>
        </form>
      </section>
    </div>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
const toolNames = {
  get_order: '查询订单',
  get_warehouse_events: '核查仓库记录',
  get_tracking: '查询物流轨迹',
  search_policy: '检索处理政策',
  get_policy_document: '核对政策全文',
};
let busy = false;

function el(tag, text, className) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  element.textContent = text;
  return element;
}

function appendMessage(message) {
  const bubble = el('div', '', 'bubble ' + message.role);
  if (message.role === 'user') {
    bubble.textContent = message.text;
  } else {
    bubble.append(el('div', '◈ 订单助手', 'who'),
      el('div', message.text.replaceAll('P-DELAY', '《订单延误处理指引》'), 'answer'));
    if (message.tools?.length) {
      const details = el('details', '');
      details.append(el('summary', '已核查 ' + message.tools.length + ' 项证据'));
      for (const tool of message.tools) {
        const step = el('details', '');
        const name = toolNames[tool.name] || tool.name;
        step.append(el('summary', name + (tool.status === 'ok' ? ' · 已完成' : ' · 失败')),
          el('pre', JSON.stringify(tool.result, null, 2)));
        details.append(step);
      }
      bubble.append(details);
    }
  }
  $('messages').append(bubble);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function showWelcome() {
  const welcome = el('div', '', 'welcome');
  welcome.id = 'welcome';
  welcome.append(el('div', '◈', 'avatar'), el('h1', '要调查哪笔订单？'),
    el('p', '告诉我订单号和你想核实的问题。我会查订单、仓库、物流和政策记录。'));
  const suggestions = el('div', '', 'suggestions');
  for (const question of [
    'A1024 为什么还没到？',
    '帮我查一下 A1025 出库了吗？',
    'A1026 的物流情况需要升级人工吗？',
  ]) {
    const button = el('button', question);
    button.append(el('span', '↗'));
    button.onclick = () => {
      $('prompt').value = question;
      $('prompt').focus();
    };
    suggestions.append(button);
  }
  welcome.append(suggestions);
  $('messages').append(welcome);
}

async function submit(text) {
  if (busy || !text.trim()) return;
  busy = true;
  $('send').disabled = true;
  $('welcome')?.remove();
  $('prompt').value = '';
  appendMessage({role: 'user', text});
  const pending = el('div', '◈ 正在核查订单与物流信息…', 'busy');
  $('messages').append(pending);
  try {
    const response = await fetch('/api/investigate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text}),
    });
    const result = await response.json();
    if (!response.ok && response.status !== 400) throw Error(result.error);
    pending.remove();
    appendMessage({role: 'assistant', text: result.answer || result.error, tools: result.tools});
  } catch (error) {
    pending.textContent = '调查未完成：' + error.message;
    pending.className = 'error';
  } finally {
    busy = false;
    $('send').disabled = false;
  }
}

$('form').onsubmit = event => {
  event.preventDefault();
  submit($('prompt').value);
};
$('prompt').onkeydown = event => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    submit($('prompt').value);
  }
};
showWelcome();
</script>
</html>
