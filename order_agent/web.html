<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>订单助手 · 订单工作台</title><style>
*{box-sizing:border-box}body{margin:0;color:#28332f;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff}button,textarea{font:inherit}button{cursor:pointer}aside{width:220px;background:#f6f8f7;border-right:1px solid #e6ebe8;height:100vh;padding:24px 16px;display:flex;flex-direction:column}.logo{font-size:21px;font-weight:700;padding:0 10px 30px;color:#245e48}.nav{padding:12px;background:#e5eee9;border-radius:7px;color:#276349}.label{font-size:11px;color:#939d97;letter-spacing:1px;margin:30px 10px 12px}.case{border:0;background:transparent;width:100%;text-align:left;padding:13px 12px;border-radius:7px;margin:3px 0;color:#4e5a53}.case.active{background:#fff;box-shadow:0 1px 4px #192f1910}.case small{display:block;color:#929b96;font-size:12px;margin-top:6px}.account{margin-top:auto;padding:14px 8px;border-top:1px solid #e2e8e4;color:#7a857e;font-size:12px}.shell{display:flex;height:100vh}main{flex:1;min-width:0;display:flex;flex-direction:column}header{height:74px;flex-shrink:0;border-bottom:1px solid #e8ece9;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.title{font-weight:600}.sub{font-size:12px;color:#8a958e;margin-top:5px}.mode{font-size:11px;color:#7b887f;border:1px solid #e4e9e5;border-radius:20px;padding:6px 10px}.workspace{display:flex;flex:1;min-height:0}.conversation{flex:1;min-width:0;display:flex;flex-direction:column}.messages{overflow:auto;flex:1;padding:38px max(28px,7%)}.welcome{margin:9vh auto 35px;max-width:520px}.avatar{width:36px;height:36px;border-radius:10px;background:#e7f1eb;color:#28634a;display:grid;place-items:center;font-size:21px}h1{font-size:25px;font-weight:600;letter-spacing:-.7px;margin:20px 0 12px}p{line-height:1.8;color:#869087}.suggestions{display:grid;gap:10px;margin-top:26px}.suggestions button{border:1px solid #e4e9e5;border-radius:9px;padding:15px 18px;background:#fff;text-align:left;color:#516158}.suggestions button:hover{background:#f5f9f6;border-color:#a8c6b4}.suggestions span{float:right;color:#93a59a}.composer{padding:16px 28px 22px;max-width:880px;width:100%;margin:auto}.input{border:1px solid #dce4de;border-radius:12px;padding:14px;box-shadow:0 3px 16px #203c2310}textarea{border:0;resize:none;width:100%;outline:0;height:54px;background:transparent;color:#34483b}.inputbar{display:flex;align-items:center;justify-content:space-between;color:#8b998f;font-size:12px}.send{border:0;border-radius:7px;background:#2a684c;color:#fff;padding:9px 16px}.send:disabled{opacity:.45}.note{font-size:10px;color:#a0aaa3;text-align:center;margin-top:10px}.context{width:290px;border-left:1px solid #e8ece9;background:#fcfdfc;padding:26px 22px;overflow:auto}.context h2{font-size:12px;color:#8e9b92;font-weight:500;margin:0 0 20px}.orderid{font-size:22px;font-weight:600}.pill{display:inline-block;background:#fff0dd;color:#a97c37;padding:5px 8px;font-size:11px;border-radius:5px;margin-top:10px}.product{border-top:1px solid #e7ece8;border-bottom:1px solid #e7ece8;margin:24px 0;padding:20px 0;display:flex;gap:12px;align-items:center}.icon{background:#eef2ef;padding:12px;border-radius:8px;font-size:22px}.product small{display:block;color:#9aa49d;margin-top:6px}dl{display:grid;grid-template-columns:1fr auto;gap:18px;font-size:12px}dt{color:#94a097}dd{margin:0;color:#526359}.context p{font-size:12px}.bubble{max-width:700px;margin:0 0 28px;line-height:1.9;white-space:pre-wrap}.user{background:#f1f5f2;border-radius:12px;padding:14px 18px;margin-left:auto;width:fit-content;max-width:85%}.assistant .who{font-size:12px;font-weight:600;color:#3d7957;margin-bottom:12px}.answer{white-space:pre-wrap}details{white-space:normal;margin-top:16px;border:1px solid #e3eae4;border-radius:8px;padding:10px 14px;color:#738578;font-size:12px}summary{cursor:pointer}pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8f6;padding:10px}.busy{color:#7c9484;font-size:13px}.error{color:#ab534b}@media(max-width:1000px){.context{width:240px}aside{width:185px}}@media(max-width:750px){aside{width:140px;padding:18px 8px}.context{display:none}header{padding:15px}.messages{padding:25px 18px}.composer{padding:12px}.mode{max-width:125px}.welcome{margin-top:35px}h1{font-size:22px}}
</style><div class="shell"><aside><div class="logo">◈ 订单助手</div><div class="nav">▣ &nbsp; 订单工作台</div><div class="label">订单会话</div><div id="cases"></div><div class="account">◉ &nbsp; 客服工作空间</div></aside><main><header><div><div class="title" id="title">订单调查</div></div></header><div class="workspace"><section class="conversation"><div class="messages" id="messages" aria-live="polite"></div><form class="composer" id="form"><div class="input"><textarea id="prompt" aria-label="输入订单问题" placeholder="询问订单进度、延误原因或处理建议…" maxlength="1800"></textarea><div class="inputbar"><span id="scope"></span><button class="send" id="send" disabled>发送 ↑</button></div></div><div class="note">建议供人工审核 · 当前业务数据为模拟数据</div></form></section><section class="context" id="context"></section></div></main></div><script>
const $=id=>document.getElementById(id);let selected,orders={},histories={},busy=false;const names={in_transit:'运输中',awaiting_dispatch:'待出库'},tools={get_order:'查询订单',get_warehouse_events:'核查仓库记录',get_tracking:'查询物流轨迹',search_policy:'检索处理政策',get_policy_document:'核对政策全文'};
function el(tag,text,cls){const x=document.createElement(tag);x.textContent=text;if(cls)x.className=cls;return x}
function render(){const o=orders[selected];$('title').textContent='订单 #'+selected;$('scope').textContent='关联订单 #'+selected;document.querySelectorAll('.case').forEach(b=>b.classList.toggle('active',b.dataset.id===selected));$('context').replaceChildren(el('h2','订单详情'),el('div','#'+selected,'orderid'),el('span',names[o.status]||o.status,'pill'));const product=el('div','','product');product.append(el('div','▣','icon'));const desc=el('div',o.items[0].name);desc.append(el('small',o.items[0].sku+' · 数量 '+o.items[0].quantity));product.append(desc);$('context').append(product);const dl=el('dl','');[['客户编号',o.customer_id],['物流单号',o.tracking_number],['承诺送达',o.promised_date],['数据截至',o.as_of]].forEach(([k,v])=>dl.append(el('dt',k),el('dd',v)));$('context').append(dl,el('h2','最近客户记录'));o.support_history.forEach(h=>$('context').append(el('p',h.message)));$('messages').replaceChildren();const items=histories[selected]||[];if(!items.length){const w=el('div','','welcome');w.append(el('div','◈','avatar'),el('h1','这笔订单，需要我帮你查什么？'),el('p','我可以核查履约情况、追踪物流，并根据订单证据整理处理建议。'));const suggestions=el('div','','suggestions');['这笔订单为什么还没收到？','调查当前进度并建议下一步','核查这笔订单是否需要升级人工'].forEach(t=>{const b=el('button',t);b.append(el('span','↗'));b.onclick=()=>submit(t);suggestions.append(b)});w.append(suggestions);$('messages').append(w)}items.forEach(item=>{const b=el('div','', 'bubble '+item.role);if(item.role==='user')b.textContent=item.text;else{b.append(el('div','◈ 订单助手','who'),el('div',item.text.replaceAll('P-DELAY','《订单延误处理指引》'),'answer'));if(item.tools){const d=el('details','');d.append(el('summary','已核查 '+item.tools.length+' 项证据'));item.tools.forEach(t=>{const sub=el('details','');sub.append(el('summary',(tools[t.name]||t.name)+(t.status==='ok'?' · 已完成':' · 失败')),el('pre',JSON.stringify(t.result,null,2)));d.append(sub)});b.append(d)}}$('messages').append(b)});$('messages').scrollTop=$('messages').scrollHeight}
async function submit(text){if(busy||!selected||!text.trim())return;busy=true;$('send').disabled=true;document.querySelectorAll('.case').forEach(b=>b.disabled=true);const id=selected;histories[id]??=[];histories[id].push({role:'user',text});$('prompt').value='';render();const pending=el('div','◈ 正在核查订单与物流信息…','busy');$('messages').append(pending);try{const r=await fetch('/api/investigate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order:id,message:text})});const d=await r.json();if(!r.ok)throw Error(d.error);histories[id].push({role:'assistant',text:d.answer,tools:d.tools});render()}catch(e){pending.textContent='调查未完成：'+e.message+'。请重新发送以重试。';pending.className='error'}finally{busy=false;$('send').disabled=false;document.querySelectorAll('.case').forEach(b=>b.disabled=false)}}
$('form').onsubmit=e=>{e.preventDefault();submit($('prompt').value)};$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit($('prompt').value)}};
fetch('/api/status').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{orders=d.details;d.orders.forEach(id=>{const b=el('button','#'+id,'case');b.dataset.id=id;b.append(el('small',names[orders[id].status]||orders[id].status));b.onclick=()=>{selected=id;render()};$('cases').append(b)});selected=d.orders[0];render();$('send').disabled=false}).catch(()=>{$('messages').append(el('p','连接失败，请刷新页面重试。','error'))});
</script></html>
